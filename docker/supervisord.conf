[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; 3 processes: fetch/import is network+disk bound, not CPU bound, so running
; several downloads concurrently doesn't compete with FFmpeg for CPU.
[program:queue-default]
command=php /var/www/html/artisan queue:work database --queue=default --sleep=1 --tries=1 --timeout=0
process_name=%(program_name)s_%(process_num)02d
numprocs=3
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
; Give Laravel's own graceful worker shutdown (finish the current job, stop
; pulling new ones on SIGTERM) enough time to actually complete a fetch
; before supervisord escalates to SIGKILL. The previous 10s default routinely
; elapsed mid-download, killing the worker but not the fetch loop underneath it.
stopwaitsecs=90

; 3 worker processes so up to CDN_REMUX_CONCURRENCY (default 3) cheap
; fast-start jobs can actually run in parallel, while extra idle workers
; just wait for a transcode pool slot to free up (see
; App\Queue\Middleware\ConcurrencyPool) rather than adding real load —
; actual FFmpeg concurrency is bounded by CDN_TRANSCODE_CONCURRENCY /
; CDN_REMUX_CONCURRENCY regardless of how many worker processes exist here.
[program:queue-optimization]
command=php /var/www/html/artisan queue:work database --queue=optimization --sleep=1 --tries=1 --timeout=0
process_name=%(program_name)s_%(process_num)02d
numprocs=3
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
; Same rationale as queue-default. This does NOT make a multi-hour transcode
; safe from SIGKILL on deploy — it only lets short/medium jobs (remux,
; smaller compresses) finish cleanly instead of orphaning. A job that
; outlives this window still gets SIGKILLed, its FFmpeg child still survives
; as an orphan and finishes on disk, but ProcessingLiveness's short TTL
; (~2 minutes) now lets media:recover-stale-optimizations notice and
; reconcile it quickly instead of after up to several hours.
stopwaitsecs=90

[program:queue-nbx-webhook]
command=php /var/www/html/artisan queue:work database --queue=nbx-webhook --sleep=3 --tries=1 --timeout=120
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:queue-media-maintenance]
command=php /var/www/html/artisan queue:work database --queue=media-maintenance --sleep=3 --tries=2 --timeout=21600
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
